<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sermons">
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<title>Sermon Notes</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ec; --card:#fffdf9; --ink:#231d16; --muted:#7a6f62; --line:#e6ddcf;
    --accent:#9a4a2b; --accent-soft:#f1e3d8; --danger:#b3261e;
    --serif:"Fraunces",Georgia,serif; --sans:"Inter",-apple-system,system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16130f; --card:#211c17; --ink:#f1e9dd; --muted:#a39684; --line:#352d25;
      --accent:#e08a62; --accent-soft:#3a2a20; --danger:#ff8a80; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:16px 18px 120px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .hidden{display:none!important}

  /* header */
  .top{display:flex;align-items:flex-end;justify-content:space-between;margin:12px 0 14px}
  h1{font-family:var(--serif);font-weight:600;font-size:34px;margin:0;letter-spacing:-.5px}
  .count{color:var(--muted);font-size:14px;margin-bottom:6px}
  .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;outline:none}
  .search:focus{border-color:var(--accent)}
  .banner{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:10px 0 0}

  /* list */
  .month{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
  .card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .card:active{transform:scale(.99)}
  .card .t{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.25;margin-bottom:4px}
  .card .meta{font-size:13px;color:var(--muted)}
  .card .verse{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px;margin-top:8px}
  .card .snip{font-size:14px;color:var(--muted);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty .big{font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:6px}

  .fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));background:var(--accent);color:#fff;border-radius:999px;padding:15px 22px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18)}

  /* editor */
  .bar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
  .back{color:var(--accent);font-weight:600;padding:6px 0}
  .status{font-size:13px;color:var(--muted)}
  .actions{display:flex;gap:4px}
  .iconbtn{padding:6px 10px;border-radius:8px;font-size:14px;color:var(--muted)}
  .iconbtn:active{background:var(--accent-soft)}
  .title-in{width:100%;border:0;background:none;color:var(--ink);font-family:var(--serif);font-size:28px;font-weight:600;outline:none;padding:6px 0;letter-spacing:-.3px}
  .title-in::placeholder{color:var(--muted);opacity:.6}
  .fields{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0 18px}
  .row{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 14px}
  .row:last-child{border-bottom:0}
  .row label{width:72px;flex-shrink:0;font-size:13px;color:var(--muted);font-weight:500}
  .row input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;padding:13px 0;outline:none}
  .row input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px}
  .notes-in{width:100%;min-height:50vh;border:0;background:none;color:var(--ink);font:inherit;font-size:17px;line-height:1.6;outline:none;resize:none;padding:0}
  .notes-in::placeholder{color:var(--muted);opacity:.6}

  .confirm{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:16px 18px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.12);z-index:20}
  .confirm p{margin:0 0 12px;font-weight:500}
  .confirm .btns{display:flex;gap:10px}
  .confirm button{flex:1;padding:12px;border-radius:10px;font-weight:600;border:1px solid var(--line)}
  .confirm .del{background:var(--danger);color:#fff;border-color:var(--danger)}
  .backup{display:flex;gap:10px;justify-content:center;margin:30px 0 0}
  .backup button{font-size:13px;color:var(--muted);padding:8px 12px;border:1px solid var(--line);border-radius:999px}
  .toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30}
</style>
</head>
<body>
<div class="wrap">

  <!-- LIST VIEW -->
  <section id="listView">
    <div class="top">
      <h1>Sermons</h1>
      <div class="count" id="count"></div>
    </div>
    <input id="search" class="search" type="search" placeholder="Search pastor, title, verse, notes…" autocomplete="off">
    <div id="banner" class="banner hidden"></div>
    <div id="list"></div>
    <div class="backup">
      <button id="exportBtn">Back up notes</button>
      <button id="importBtn">Restore from backup</button>
      <input id="importFile" type="file" accept=".json,application/json" class="hidden">
    </div>
  </section>

  <!-- EDITOR VIEW -->
  <section id="editView" class="hidden">
    <div class="bar">
      <button class="back" id="backBtn">‹ Sermons</button>
      <span class="status" id="status"></span>
      <div class="actions">
        <button class="iconbtn" id="copyBtn">Copy</button>
        <button class="iconbtn" id="delBtn">Delete</button>
      </div>
    </div>
    <input id="fTitle" class="title-in" placeholder="Sermon title" autocomplete="off">
    <div class="fields">
      <div class="row"><label for="fPastor">Pastor</label><input id="fPastor" list="pastors" placeholder="Who's preaching" autocomplete="off"></div>
      <div class="row"><label for="fDate">Date</label><input id="fDate" type="date"></div>
      <div class="row"><label for="fVerse">Verse</label><input id="fVerse" placeholder="e.g. Romans 12:1-2" autocomplete="off"></div>
    </div>
    <datalist id="pastors"></datalist>
    <textarea id="fNotes" class="notes-in" placeholder="Take your notes here…"></textarea>
  </section>
</div>

<button class="fab" id="newBtn">+ New sermon</button>

<div class="confirm hidden" id="confirm">
  <p>Delete this sermon? This can't be undone.</p>
  <div class="btns"><button id="cancelDel">Cancel</button><button class="del" id="doDel">Delete</button></div>
</div>
<div class="toast hidden" id="toast"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const LS_KEY = "sermon-notes-v1";
  let notes = [];            // [{id, title, pastor, date, verse, notes, updatedAt}]
  let store = null;          // {save(id,data), remove(id)}
  let currentId = null, dirty = false, saveTimer = null, loaded = false;
  const writeChains = {};    // one write at a time per doc

  /* ---------- helpers ---------- */
  const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  const fmtDate = s => { if(!s) return ""; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"}); };
  const monthKey = s => { if(!s) return "No date"; const [y,m]=s.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"}); };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const esc = s => String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.add("hidden"),1800); }
  function sortNotes(){ notes.sort((a,b)=>(b.date||"").localeCompare(a.date||"") || (b.updatedAt||0)-(a.updatedAt||0)); }
  function banner(msg){ const b=$("banner"); if(msg){ b.textContent=msg; b.classList.remove("hidden"); } else b.classList.add("hidden"); }

  /* ---------- local fallback store ---------- */
  function localStore(){
    try{ notes = JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch(e){ notes=[]; }
    const persist = () => { try{ localStorage.setItem(LS_KEY, JSON.stringify(notes)); }catch(e){} };
    return { save: async()=>persist(), remove: async()=>persist() };
  }

  /* ---------- list ---------- */
  function renderList(){
    const q = $("search").value.trim().toLowerCase();
    const shown = notes.filter(n=>!q || [n.title,n.pastor,n.verse,n.notes,fmtDate(n.date)].join(" ").toLowerCase().includes(q));
    $("count").textContent = notes.length ? notes.length + (notes.length===1?" sermon":" sermons") : "";
    const list = $("list");
    if(!loaded){ list.innerHTML = '<div class="empty">Loading…</div>'; return; }
    if(!notes.length){ list.innerHTML = '<div class="empty"><div class="big">No sermons yet</div>Tap “New sermon” on Sunday to start.</div>'; return; }
    if(!shown.length){ list.innerHTML = '<div class="empty">Nothing matches “'+esc(q)+'”.</div>'; return; }
    let html="", lastMonth=null;
    for(const n of shown){
      const mk = monthKey(n.date);
      if(mk!==lastMonth){ html += '<div class="month">'+esc(mk)+'</div>'; lastMonth=mk; }
      const meta = [n.pastor, fmtDate(n.date)].filter(Boolean).map(esc).join(" · ");
      html += '<button class="card" data-id="'+esc(n.id)+'">'
        + '<div class="t">'+(esc(n.title)||'<span style="color:var(--muted)">Untitled sermon</span>')+'</div>'
        + (meta?'<div class="meta">'+meta+'</div>':'')
        + (n.verse?'<span class="verse">'+esc(n.verse)+'</span>':'')
        + (n.notes?'<div class="snip">'+esc(n.notes)+'</div>':'')
        + '</button>';
    }
    list.innerHTML = html;
  }
  $("list").addEventListener("click", e=>{ const c=e.target.closest(".card"); if(c) openNote(c.dataset.id); });
  $("search").addEventListener("input", renderList);

  function refreshPastors(){
    const names=[...new Set(notes.map(n=>(n.pastor||"").trim()).filter(Boolean))];
    $("pastors").innerHTML = names.map(p=>'<option value="'+esc(p)+'">').join("");
  }

  /* ---------- editor ---------- */
  const F = {title:$("fTitle"), pastor:$("fPastor"), date:$("fDate"), verse:$("fVerse"), notes:$("fNotes")};
  function autoGrow(){ const t=F.notes; t.style.height="auto"; t.style.height=Math.max(t.scrollHeight, window.innerHeight*0.5)+"px"; }

  function openNote(id){
    let n = notes.find(x=>x.id===id);
    if(!n){ // new
      const last = notes[0];
      n = {id:newId(), title:"", pastor:last?last.pastor||"":"", date:today(), verse:"", notes:"", updatedAt:Date.now(), _new:true};
      notes.unshift(n);
    }
    currentId=n.id; dirty=false;
    for(const k in F) F[k].value = n[k]||"";
    refreshPastors();
    $("status").textContent="";
    $("listView").classList.add("hidden"); $("newBtn").classList.add("hidden");
    $("editView").classList.remove("hidden");
    window.scrollTo(0,0); autoGrow();
    if(n._new) F.title.focus();
  }

  function current(){ return notes.find(x=>x.id===currentId); }

  function onEdit(){
    const n=current(); if(!n) return;
    for(const k in F) n[k]=F[k].value;
    n.updatedAt=Date.now(); dirty=true;
    $("status").textContent="Editing…";
    clearTimeout(saveTimer); saveTimer=setTimeout(flush, 700);
  }
  for(const k in F) F[k].addEventListener("input", onEdit);
  F.date.addEventListener("change", onEdit);
  F.notes.addEventListener("input", autoGrow);

  async function flush(){
    clearTimeout(saveTimer);
    const n=current(); if(!n || !dirty) return;
    if(!store){ saveTimer=setTimeout(flush,1000); return; }
    const {id,_new,...data} = n; delete n._new;
    try{ await store.save(id, data); if(currentId===id) { dirty=false; $("status").textContent="Saved"; } }
    catch(e){ $("status").textContent="Not saved — retrying"; saveTimer=setTimeout(flush,3000); }
  }

  async function closeEditor(){
    const n=current();
    await flush();
    // drop an untouched new note
    if(n && n._new && !n.title && !n.notes && !n.verse){ notes = notes.filter(x=>x.id!==n.id); }
    currentId=null; dirty=false;
    sortNotes();
    $("editView").classList.add("hidden");
    $("listView").classList.remove("hidden"); $("newBtn").classList.remove("hidden");
    renderList(); window.scrollTo(0,0);
  }
  $("backBtn").addEventListener("click", closeEditor);
  $("newBtn").addEventListener("click", ()=>openNote(null));
  window.addEventListener("pagehide", flush);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flush(); });

  $("copyBtn").addEventListener("click", async()=>{
    const n=current(); if(!n) return;
    const text = [n.title||"Untitled sermon", [n.pastor, fmtDate(n.date)].filter(Boolean).join(" · "), n.verse, "", n.notes].filter((x,i)=>x||i===3).join("\n");
    try{ await navigator.clipboard.writeText(text); toast("Copied"); }catch(e){ toast("Couldn't copy"); }
  });

  $("delBtn").addEventListener("click", ()=>$("confirm").classList.remove("hidden"));
  $("cancelDel").addEventListener("click", ()=>$("confirm").classList.add("hidden"));
  $("doDel").addEventListener("click", async()=>{
    $("confirm").classList.add("hidden");
    const n=current(); if(!n) return;
    clearTimeout(saveTimer); dirty=false;
    notes = notes.filter(x=>x.id!==n.id);
    const wasNew = n._new;
    currentId=null;
    $("editView").classList.add("hidden");
    $("listView").classList.remove("hidden"); $("newBtn").classList.remove("hidden");
    renderList();
    if(!wasNew){ try{ await store.remove(n.id); toast("Deleted"); }catch(e){ toast("Couldn't delete"); } }
  });

  /* ---------- start ---------- */
  renderList();
  store = localStore(); loaded = true; sortNotes(); renderList();
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

  /* ---------- backup / restore ---------- */
  $("exportBtn").addEventListener("click", async()=>{
    const clean = notes.map(({_new,...n})=>n);
    const json = JSON.stringify({app:"sermon-notes", exported:new Date().toISOString(), notes:clean}, null, 2);
    const name = "sermon-notes-backup-"+today()+".json";
    const file = new File([json], name, {type:"application/json"});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
    }catch(e){ if(e && e.name==="AbortError") return; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  });
  $("importBtn").addEventListener("click", ()=>$("importFile").click());
  $("importFile").addEventListener("change", async e=>{
    const f=e.target.files[0]; e.target.value=""; if(!f) return;
    try{
      const data=JSON.parse(await f.text());
      const incoming=Array.isArray(data)?data:data.notes;
      if(!Array.isArray(incoming)) throw 0;
      let added=0;
      for(const n of incoming){ if(n && n.id && !notes.some(x=>x.id===n.id)){ notes.push(n); added++; } }
      sortNotes(); await store.save(); renderList();
      toast(added? "Restored "+added+(added===1?" sermon":" sermons") : "Nothing new in that backup");
    }catch(err){ toast("That file isn't a sermon backup"); }
  });
})();
</script>
</body>
</html>
